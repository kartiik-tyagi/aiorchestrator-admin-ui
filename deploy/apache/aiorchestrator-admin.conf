# Serve Orchestrator Admin UI from /aiorchestrator-admin
# Static files: /var/www/additional-gui/aiorchestrator-admin
# API: browser calls /v1 and /mi/v1 on this Apache host; proxy them to the
# Go process (coral-aiorchestrator.service on 127.0.0.1:8011).

Alias /aiorchestrator-admin /var/www/additional-gui/aiorchestrator-admin

<Directory "/var/www/additional-gui/aiorchestrator-admin">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Enable React Router (SPA) - fallback to index.html for 404s
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /aiorchestrator-admin
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /aiorchestrator-admin/index.html [L]
    </IfModule>
</Directory>

# Ensure trailing slash redirect
RedirectMatch 301 ^/aiorchestrator-admin$ /aiorchestrator-admin/

# Same-origin API (the built UI fetches /v1 and /mi/v1, not :8011).
ProxyPass /v1 http://127.0.0.1:8011/v1
ProxyPassReverse /v1 http://127.0.0.1:8011/v1
ProxyPass /mi http://127.0.0.1:8011/mi
ProxyPassReverse /mi http://127.0.0.1:8011/mi
